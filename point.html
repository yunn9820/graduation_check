<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>畢業學分檢核表</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<header class="site-header">
  <h1>畢業學分檢核表</h1>
</header>
<main class="container" id="app">
    <section aria-labelledby="summary-heading" class="summary-section">
        <h2 id="summary-heading" class="visually-hidden">總覽</h2>
        <div class="summary-box">
            <div>
                畢業應修總學分
                <span class="number" id="required-credits">134</span>
            </div>
            <div>
                目前已修畢學分數
                <span class="number green" id="total-credits">0</span>
            </div>
            <div>
                尚需修習學分數
                <span class="number" id="remaining-credits">0</span>
            </div>
        </div>
        <div class="progress-wrapper" aria-hidden="false">
          <div class="progress-label">完成進度</div>
          <div class="progress-bar" aria-hidden="true">
            <div id="progress-fill" class="progress-fill" style="width:0%"></div>
          </div>
        </div>
    </section>

    <section class="req-box" aria-labelledby="rules-heading">
        <h2 id="rules-heading">🎯 修業規則達成狀況</h2>
        <ul class="req-list" id="req-list" aria-live="polite"></ul>
    </section>

    <section id="categories-container" aria-labelledby="categories-heading">
      <h2 id="categories-heading" class="visually-hidden">課程類別</h2>
      <!-- JS will populate accordions here -->
    </section>

    <section class="add-course-container" aria-labelledby="add-course-heading">
        <h2 id="add-course-heading">新增自行修習課程</h2>
        <form id="add-course-form">
        <div class="form-row">
            <div class="form-group">
                <label for="course-category">課程類別</label>
                <select id="course-category" name="category">
                    <option value="校定必修">校定必修</option>
                    <option value="院基礎">院基礎</option>
                    <option value="系定必修">系定必修</option>
                    <option value="核心/模組">核心/模組</option>
                    <option value="通識">通識</option>
                    <option value="其他選修">其他選修</option>
                </select>
            </div>
            <div class="form-group">
                <label for="course-semester">學年/學期</label>
                <input type="text" id="course-semester" name="semester" placeholder="大四下">
            </div>
            <div class="form-group">
                <label for="course-name">課程名稱</label>
                <input type="text" id="course-name" name="name" placeholder="請輸入課程名稱">
            </div>
            <div class="form-group">
                <label for="course-credits">學分數</label>
                <input type="number" id="course-credits" name="credits" min="0" step="0.5" value="2">
            </div>
            <div class="form-group">
                <label for="course-status">狀態</label>
                <select id="course-status" name="status">
                    <option value="已修畢">已修畢</option>
                    <option value="未修畢">未修畢</option>
                </select>
            </div>
        </div>
        <div class="form-row">
          <button type="submit" id="add-course-btn" class="btn">新增課程</button>
          <button type="button" id="export-btn" class="btn btn-secondary">匯出 JSON</button>
          <button type="button" id="import-btn" class="btn btn-secondary">匯入 JSON</button>
        </div>
        </form>
    </section>
</main>

<script src="assets/point.js" defer></script>
</body>
</html>
