            : `<span class="status-missing">尚缺 ${coreReq - creditsMap["核心/模組"]} 學分</span>`;
        reqList.innerHTML += `<li><strong>核心/模組：</strong> ${coreStatus}</li>`;
        
        // 其他選修 (22學分) - 計算方式: 總學分(134)扣除 必修(20+30+35=85) 和 核心模組(15) 和 通識(12) 剩餘 22 學分。 
        const otherReq = 22;
        let otherStatus = creditsMap["其他選修"] >= otherReq
            ? `<span class="status-ok">已達成 (${creditsMap["其他選修"]}/${otherReq})</span>`
            : `<span class="status-missing">尚缺 ${otherReq - creditsMap["其他選修"]} 學分 (目前已修畢 ${creditsMap["其他選修"]} 學分)</span>`;
        reqList.innerHTML += `<li><strong>其他選修：</strong> ${otherStatus}</li>`;

        // 5. 通識 (12學分 - 人文4, 自然4, 社會4, 歷史2)
        let genEdMsg = [];
        if (genEd.humanities < 4) genEdMsg.push(`人文領域差 ${4 - genEd.humanities} 學分`);
        if (genEd.nature < 4) genEdMsg.push(`自然領域差 ${4 - genEd.nature} 學分`);
        if (genEd.social < 4) genEdMsg.push(`社會領域差 ${4 - genEd.social} 學分`);
        if (genEd.history < 2) genEdMsg.push(`歷史學群差 ${2 - genEd.history} 學分`);
        
        let genEdStatus = genEdMsg.length === 0 && creditsMap["通識"] >= 12
            ? `<span class="status-ok">已達成</span>`
            : `<span class="status-missing">${genEdMsg.join("、")}</span>`;
        reqList.innerHTML += `<li><strong>通識課程：</strong> ${genEdStatus}</li>`;

        // 6. 全英課程 (5門)
        const engReq = 5;
        let engStatus = englishCoursesCount >= engReq
            ? `<span class="status-ok">已達成 (${englishCoursesCount} 門)</span>`
            : `<span class="status-missing">尚缺 ${engReq - englishCoursesCount} 門全英課程</span>`;
        reqList.innerHTML += `<li><strong>全英專業課程：</strong> ${engStatus}</li>`;

        // 7. 英文檢定門檻
        reqList.innerHTML += `<li><strong>英文檢定門檻：</strong> <span class="status-ok">已報名系上自學課程代替</span></li>`;
    }

    function addCourse() {
        const cat = document.getElementById("course-category").value;
        const sem = document.getElementById("course-semester").value;
        const name = document.getElementById("course-name").value;
        const cred = parseFloat(document.getElementById("course-credits").value);
        const status = document.getElementById("course-status").value;

        if (!sem || !name || isNaN(cred)) {
            alert("請完整填寫所有欄位！");
            return;
        }

        coursesData.push({
            category: cat,
            semester: sem,
            name: name,
            credits: cred,
            status: status
        });

        document.getElementById("course-semester").value = "";
        document.getElementById("course-name").value = "";
        document.getElementById("course-credits").value = "2";

        renderUI();
    }

    function removeCourse(index) {
        if (confirm("確定要刪除這筆紀錄嗎？")) {
            coursesData.splice(index, 1);
            renderUI();
        }
    }

    // 初始渲染
    renderUI();
</script>

</body>
</html>
"""
